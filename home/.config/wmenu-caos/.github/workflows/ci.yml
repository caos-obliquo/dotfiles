name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            libcairo2-dev \
            libpango1.0-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev

      - name: Meson setup
        run: meson setup build

      - name: Build
        run: ninja -C build
