#? btop config file, v.1.4.7

#* color_theme: .theme file name; "Default" and "TTY" are builtin
color_theme = "Default"

#* theme_background: show the theme background; false for terminal transparency
theme_background = true

#* truecolor: use 24-bit color; falls back to 256 color if false
truecolor = true

#* force_tty: force tty mode with 16 colors and tty symbols even in a real tty
force_tty = false

#* disable_presets: disable default, custom, or all presets ("Off" enables all)
disable_presets = "Off"

#* presets: box layout presets, format "box_name:P:G", space separated (max 9)
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"

#* vim_keys: enable h/j/k/l/g/G keys for directional list control
vim_keys = false

#* disable_mouse: disable all mouse events
disable_mouse = false

#* rounded_corners: rounded box corners (ignored in tty mode)
rounded_corners = true

#* terminal_sync: synchronized output to reduce flickering
terminal_sync = true

#* graph_symbol: braille, block, or tty; braille is highest resolution
graph_symbol = "braille"

# graph_symbol_cpu: symbol for cpu box graphs (default, braille, block, tty)
graph_symbol_cpu = "default"

# graph_symbol_gpu: symbol for gpu box graphs (default, braille, block, tty)
graph_symbol_gpu = "default"

# graph_symbol_mem: symbol for memory box graphs (default, braille, block, tty)
graph_symbol_mem = "default"

# graph_symbol_net: symbol for network box graphs (default, braille, block, tty)
graph_symbol_net = "default"

# graph_symbol_proc: symbol for process box graphs
graph_symbol_proc = "default"

#* shown_boxes: boxes to show, e.g. "cpu mem net proc" or "gpu0".."gpu5"
shown_boxes = "cpu mem net proc"

#* update_ms: ui update interval in ms (2000 or above recommended)
update_ms = 2000

#* proc_sorting: process sort key; "cpu lazy" sorts top process over time
proc_sorting = "name"

#* proc_reversed: reverse the process sort order
proc_reversed = false

#* proc_tree: show processes as a tree
proc_tree = false

#* proc_colors: use cpu graph colors in the process list
proc_colors = true

#* proc_gradient: use a darkening gradient in the process list
proc_gradient = true

#* proc_per_core: show cpu usage per core instead of total
proc_per_core = false

#* proc_mem_bytes: show process memory as bytes instead of percent
proc_mem_bytes = true

#* proc_cpu_graphs: show a cpu graph for each process
proc_cpu_graphs = true

#* proc_info_smaps: use /proc/[pid]/smaps for memory info (slow but accurate)
proc_info_smaps = false

#* proc_left: show the proc box on the left instead of the right
proc_left = false

#* proc_filter_kernel: filter kernel processes, similar to htop
proc_filter_kernel = false

#* proc_follow_detailed: follow the selected process in the detailed view
proc_follow_detailed = true

#* proc_aggregate: accumulate child resources into the parent in tree view
proc_aggregate = false

#* keep_dead_proc_usage: keep cpu/mem display for dead processes when paused
keep_dead_proc_usage = false

#* cpu_graph_upper: cpu stat shown in the upper half of the cpu graph
cpu_graph_upper = "Auto"

#* cpu_graph_lower: cpu stat shown in the lower half of the cpu graph
cpu_graph_lower = "Auto"

#* show_gpu_info: show gpu info in the cpu box (auto, on, off)
show_gpu_info = "Auto"

#* cpu_invert_lower: invert the lower cpu graph
cpu_invert_lower = true

#* cpu_single_graph: disable the lower cpu graph
cpu_single_graph = false

#* cpu_bottom: show the cpu box at the bottom
cpu_bottom = false

#* show_uptime: show system uptime in the cpu box
show_uptime = true

#* show_cpu_watts: show cpu package power in watts (needs setcap/setuid/sudo)
show_cpu_watts = true

#* check_temp: show cpu temperature
check_temp = true

#* cpu_sensor: sensor for cpu temperature, pick from the options menu
cpu_sensor = "Auto"

#* show_coretemp: show per-core temperatures when sensors are found
show_coretemp = true

#* cpu_core_map: fix mismatched core temps, format "x:y" pairs, e.g. "4:0 5:1"
cpu_core_map = ""

#* temp_scale: celsius, fahrenheit, kelvin, or rankine
temp_scale = "celsius"

#* base_10_sizes: use base 10 units (KB = 1000, not KiB = 1024)
base_10_sizes = false

#* show_cpu_freq: show cpu frequency
show_cpu_freq = true

#* freq_mode: cpu frequency calculation (first, range, lowest, highest, average)
freq_mode = "first"

#* clock_format: strftime format for the top clock, empty disables it
clock_format = "%X"

#* background_update: update the main ui while menus are open
background_update = true

#* custom_cpu_name: custom cpu model name, empty disables it
custom_cpu_name = ""

#* disks_filter: show only these mountpoints; prefix exclude= to invert
disks_filter = ""

#* mem_graphs: show graphs instead of meters for memory
mem_graphs = true

#* mem_below_net: show the mem box below the net box
mem_below_net = false

#* zfs_arc_cached: count zfs arc in cached and available memory
zfs_arc_cached = true

#* show_swap: show swap in the memory box
show_swap = true

#* swap_disk: show swap as a disk, inserted after the first disk
swap_disk = true

#* show_disks: split the mem box to also show disks
show_disks = true

#* only_physical: filter out non-physical disks
only_physical = true

#* use_fstab: read the disks list from /etc/fstab (disables only_physical)
use_fstab = true

#* zfs_hide_datasets: hide all datasets, only show zfs pools
zfs_hide_datasets = false

#* disk_free_priv: show available disk space for privileged users
disk_free_priv = false

#* show_io_stat: show io activity % in the regular disk usage view
show_io_stat = true

#* io_mode: io mode with big read/write speed graphs
io_mode = false

#* io_graph_combined: combine read/write io graphs in io mode
io_graph_combined = false

#* io_graph_speeds: top speed for io graphs in MiB/s, format "mountpoint:speed"
io_graph_speeds = ""

#* swap_upload_download: put the upload graph above the download graph
swap_upload_download = false

#* net_download: fixed download value in Mebibits, used when net_auto is false
net_download = 100

net_upload = 100

#* net_auto: auto rescale network graphs down to 10 kibibytes
net_auto = true

#* net_sync: sync download/upload autoscale to the higher one
net_sync = true

#* net_iface: network interface to start with
net_iface = ""

#* base_10_bitrate: base 10 (Kbps) or binary (Kibps); Auto follows base_10_sizes
base_10_bitrate = "Auto"

#* show_battery: show battery stats top right when a battery is present
show_battery = true

#* selected_battery: battery to use when multiple are present (auto detects)
selected_battery = "Auto"

#* show_battery_watts: show battery power next to the charge indicator
show_battery_watts = true

#* log_level: minimum level for ~/.local/state/btop.log
log_level = "WARNING"

#* save_config_on_exit: save settings to the config file on exit
save_config_on_exit = true

#* nvml_measure_pcie_speeds: measure pcie throughput on nvidia cards
nvml_measure_pcie_speeds = true

#* rsmi_measure_pcie_speeds: measure pcie throughput on amd cards
rsmi_measure_pcie_speeds = true

#* gpu_mirror_graph: horizontally mirror the gpu graph
gpu_mirror_graph = true

#* shown_gpus: gpu vendors to show (nvidia, amd, intel, apple)
shown_gpus = "nvidia amd intel"

#* custom_gpu_name0: custom gpu0 model name, empty disables it
custom_gpu_name0 = ""

#* custom_gpu_name1: custom gpu1 model name, empty disables it
custom_gpu_name1 = ""

#* custom_gpu_name2: custom gpu2 model name, empty disables it
custom_gpu_name2 = ""

#* custom_gpu_name3: custom gpu3 model name, empty disables it
custom_gpu_name3 = ""

#* custom_gpu_name4: custom gpu4 model name, empty disables it
custom_gpu_name4 = ""

#* custom_gpu_name5: custom gpu5 model name, empty disables it
custom_gpu_name5 = ""
