# PipeWire pro-audio tuning (Arch Wiki: Professional audio — PipeWire-only)
# 48000 Hz sample rate, 256-frame quantum (~5.3 ms at 48 kHz).
# Vanilla kernel is fine; this targets drop-out-free low latency like the
# wiki's 256/3 starter for JACK, mapped to PipeWire's clock quantum.
context.properties = {
    default.clock.rate   = 48000
    default.clock.quantum = 256
    default.clock.min-quantum = 128
    default.clock.max-quantum = 1024
}
