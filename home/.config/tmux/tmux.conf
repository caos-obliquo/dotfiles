# ============================================================
# tmux.conf  —  vim-grammar tmux (prefix = C-Space)
# ============================================================

# ---------- general ----------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mouse on
set -g allow-rename on
set -g status-interval 1

# ---------- terminal ----------
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -sg escape-time 0

# ---------- prefix ----------
unbind C-b
set -g prefix C-Space

# ---------- keybindings: reload ----------
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "Reloaded!"

# ---------- keybindings: splits (intuitive, current path) ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---------- keybindings: pane navigation (vim style) ----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------- keybindings: vim-style resize (repeatable) ----------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- keybindings: session / window ----------
bind s choose-session
bind w choose-window
bind o swap-pane -D

# ---------- keybindings: copy-mode (vi) ----------
setw -g mode-keys vi
bind Escape copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy'
set -s copy-command 'wl-copy'

# ---------- keybindings: misc ----------
# free c-l for pi agent model switcher
unbind -n C-l

# ---------- plugins ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @tmux-nerd-font-window-name-show-name true

# ---------- status bar: colors ----------
# full transparency: default bg everywhere (foot alpha=0.85 shows wallpaper)
set -g status-style 'bg=default,fg=#f8f8f2'
set -g status-bg 'default'
set -g status-fg '#f8f8f2'
set -g pane-active-border-style 'fg=#8be9fd'
set -g pane-border-style 'fg=#44475a'
set -g window-status-style 'fg=#6272a4,bg=default'
set -g window-status-current-style 'fg=#50fa7b,bg=default,bold'

# ---------- status bar: layout ----------
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 300
set -g pane-border-status off

# ---------- status bar: icons (nerd font) ----------
# left: arch logo + session
set -g status-left "#[fg=#8be9fd,bg=default,bold] 󰣇 #[fg=#50fa7b,bg=default,bold]#S #[fg=#6272a4]│ "
# windows: nerd-font window-name icons via plugin automatic-rename-format (#W = icon + name)
set -g window-status-format ' #W '
set -g window-status-current-format ' #W '
# right: music only (icon via tmux-music script, green playing / grey paused)
set -g status-right "#[fg=#6272a4]#(~/.local/bin/tmux-music)"

# ---------- plugin configs ----------
set -g @continuum-restore 'off'
set -g @jump-key 'f'

# ---------- tpm init ----------
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm  ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

run -b '~/.local/share/tmux/plugins/tpm/tpm'