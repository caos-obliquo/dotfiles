# pipemixer.ini — pro-audio mixer config (Arch Wiki: Professional audio)
# Setup: PipeWire-only sound server, 48000 Hz, low-latency quantum.
# Devices: Ryzen HD Audio (ALC236 analog) + QCY H3 Pro BT (default sink)

[main]
# Fine volume control — 1% steps for precise monitoring/recording levels
volume-step = 1
# Headroom above 100% (PCM max) for loud playback without clipping control
volume-min = 0
volume-max = 150
# j/k navigation wraps around — fast switching between many streams
wraparound = true
# Wiki workflow: playback first, recording second
tab-order = playback,recording,output-devices,input-devices,cards
default-tab = playback

[binds]
# vim-style defaults are kept (j/k/h/l/g/G/m/space/t, arrows, 1-5)
# explicit +/- volume binds for muscle-memory mixing (one key per line)
volume-up = =
volume-up = +
volume-down = -

[interface]
# Node: friendly description (fallback node.name), then stream name if present
node-format = {node.description?!{node.name}}{media.name?: {media.name}}
# Device: friendly description with fallback to node.name
device-format = {node.description?!{node.name}}
# Clear volume bars
bar-empty-char = ░
bar-full-char = █
# Compact route/profile lists
routes-separator = ,
profiles-separator = ,
