# current version of the config schema
version: 1
# protocol for git operations: ssh or https
git_protocol: https
# editor gh runs for issues and pull requests; blank uses the environment
editor:
# interactive prompting (not overridable by hostname): enabled or disabled
prompt: enabled
# editor-based prompting (not overridable by hostname): enabled or disabled
prefer_editor_prompt: disabled
# pager for command output, e.g. "less"; "cat" disables it
pager:
# aliases: nicknames for gh commands
aliases:
    co: pr checkout
# unix socket path for http connections; blank uses net/http default transport
http_unix_socket:
# browser gh uses when opening urls; blank uses the environment
browser:
# show labels as rgb hex in truecolor terminals: enabled or disabled
color_labels: disabled
# use customizable 4-bit accessible colors: enabled or disabled
accessible_colors: disabled
# use an accessible prompter: enabled or disabled
accessible_prompter: disabled
# animated spinner for progress; text indicator when disabled
spinner: enabled
