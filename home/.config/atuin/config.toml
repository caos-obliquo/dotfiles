## base directory for atuin data files (databases, keys, session)
# data_dir = "~/.local/share/atuin"

## db_path: database location (default: ~/.local/share/atuin/history.db)
# db_path = "~/.history.db"

## key_path: encryption key location (default: ~/.local/share/atuin/key)
# key_path = "~/.key"

## session_path: auth session token (default: ~/.local/share/atuin/session)
# session_path = "~/.session"

## dialect: date format, "us" or "uk"
# dialect = "us"

## timezone: display timezone, "local" or a UTC offset like "+9"
# timezone = "local"

## auto_sync: enable or disable automatic sync
# auto_sync = true

## update_check: enable or disable automatic update checks
# update_check = true

## sync_address: address of the sync server
# sync_address = "https://api.atuin.sh"

## sync_frequency: how often to sync history (0 = after every command)
# sync_frequency = "10m"

## search_mode: prefix, fulltext, fuzzy, or skim
# search_mode = "fuzzy"

## filter_mode: default filter mode (see search.filters for options)
# filter_mode = "global"

## workspaces: filter for commands run inside a git repo tree (default: false)
# workspaces = false

## filter_mode_shell_up_key_binding: filter mode for the shell up-key binding
# filter_mode_shell_up_key_binding = "global"

## search_mode_shell_up_key_binding: search mode for the shell up-key binding
# search_mode_shell_up_key_binding = "fuzzy"

## style: auto, full, or compact
# style = "auto"

## inline_height: max interface lines (0 = full screen)
# inline_height = 0

## inline_height_shell_up_key_binding: max lines for the shell up-key binding
# inline_height_shell_up_key_binding = 0

## invert: put the search bar at the top (default: false)
# invert = false

## show_preview: show a preview of the selected command
# show_preview = true

## exit_mode: escape behavior when searching (return-original, return-query)
# exit_mode = "return-original"

## word_jump_mode: emacs or subl
# word_jump_mode = "emacs"

## word_chars: characters that count as part of a word
# word_chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"

## scroll_context_lines: context lines when scrolling by pages
# scroll_context_lines = 1

## ctrl_n_shortcuts: use ctrl instead of alt for numeric UI shortcuts
# ctrl_n_shortcuts = false

## show_numeric_shortcuts: show numeric shortcuts (1..9) beside list items
# show_numeric_shortcuts = true

## history_format: default history list format, also settable with --format
# history_format = "{time}\t{command}\t{duration}"

## history_filter: regexes matching commands to skip from history
# history_filter = [
#   "^secret-cmd",
#   "^innocuous-cmd .*--secret=.+",
# ]

## cwd_filter: regexes matching cwd to skip from history
# cwd_filter = [
#   "^/very/secret/area",
# ]

## max_preview_height: max preview height for long scripts
# max_preview_height = 4

## show_help: show help row with version, keymap hint, and command count
# show_help = true

## show_tabs: show tabs for search and inspect
# show_tabs = true

## auto_hide_height: auto-hide tabs below this many lines (compact mode)
# auto_hide_height = 8

## secrets_filter: skip commands matching default secret patterns
# secrets_filter = true

## enter_accept: enter runs the command, tab puts it in the prompt
enter_accept = true

## command_chaining: chain after &&, || or | instead of replacing the line
# command_chaining = false

## keymap_mode: startup keymap for atuin search (auto, emacs, or vim)
# keymap_mode = "auto"

## keymap_cursor: cursor style per keymap mode
# keymap_cursor = { emacs = "blink-block", vim_insert = "blink-block", vim_normal = "steady-block" }

# network_connect_timeout = 5
# network_timeout = 5

## local_timeout: timeout in seconds for the local sqlite db connection
# local_timeout = 5

## prefers_reduced_motion: minimize ui motion, or set NO_MOTION=true
# prefers_reduced_motion = false

[stats]
## common_subcommands: commands where the subcommand counts for statistics
# common_subcommands = [
#   "apt",
#   "cargo",
#   "composer",
#   "dnf",
#   "docker",
#   "dotnet",
#   "git",
#   "go",
#   "ip",
#   "jj",
#   "kubectl",
#   "nix",
#   "nmcli",
#   "npm",
#   "pecl",
#   "pnpm",
#   "podman",
#   "port",
#   "systemctl",
#   "tmux",
#   "yarn",
# ]

## common_prefix: commands stripped and ignored from stats
# common_prefix = ["sudo"]

## ignored_commands: commands completely ignored from stats
# ignored_commands = [
#   "cd",
#   "ls",
#   "vi"
# ]

[keys]
# scroll_exits: up/down key exits the tui past the first or last entry
# scroll_exits = true

# exit_past_line_start: left arrow exits the tui before the first character
# exit_past_line_start = true

# accept_past_line_end: right arrow copies the line like tab (default: true)
# accept_past_line_end = true

# accept_past_line_start: left arrow copies the line like tab (default: false)
# accept_past_line_start = false

# accept_with_backspace: backspace copies the line like tab at line start
# accept_with_backspace = false

[sync]
# records: enable sync v2, default for new installs only
records = true

[preview]
## strategy: preview height strategy (auto, static, fixed)
# strategy = "auto"

[daemon]
## enabled: sync via the daemon; start it with atuin daemon
# enabled = false

## sync_frequency: how often the daemon syncs, in seconds
# sync_frequency = 300

## socket_path: daemon unix socket (default: ~/.local/share/atuin/atuin.sock)
# socket_path = "~/.local/share/atuin/atuin.sock"

## systemd_socket: use systemd socket activation instead of the given path
# systemd_socket = false

## tcp_port: port used for tcp on non-unix systems
# tcp_port = 8889

# [theme]
## name: color theme (builtin: default, autumn, marine; custom in ./themes)
# name = "autumn"
name = "dracula"

## debug: theme manager prints extra info to help fix themes
# debug = true

[search]
## filters: enabled filter modes, in order of priority
# filters = [ "global", "host", "session", "session-preload", "workspace", "directory" ]

[tmux]
## enabled: use a tmux popup for interactive search (tmux >= 3.2)
# enabled = false

## width: tmux popup width, percentage or integer characters
# width = "80%"

## height: tmux popup height, percentage or integer lines
# height = "60%"

[ui]
## columns: search result columns, left to right; command expands by default
# columns = ["duration", "time", "command"]
##
## Examples:
##
## Minimal - more space for commands:
# columns = ["duration", "command"]
##
## With wider directory column:
# columns = ["duration", { type = "directory", width = 30 }, "command"]
##
## Show host for multi-machine sync users:
# columns = ["duration", "time", "host", "command"]
##
## Show exit codes prominently:
# columns = ["exit", "duration", "command"]
##
## Make directory expand instead of command:
# columns = ["duration", "time", { type = "directory", expand = true }, { type = "command", expand = false }]
