name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -e
          count=0
          while IFS= read -r -d '' f; do
            bash -n "$f"
            count=$((count + 1))
          done < <(find . -name '*.sh' -type f -print0)
          echo "Checked $count shell scripts OK"

      - name: Key files present
        run: |
          test -f home/.local/bin/dwl-screenshot
          test -f home/.config/dwl/config.def.h
          echo "Key dotfiles present"
